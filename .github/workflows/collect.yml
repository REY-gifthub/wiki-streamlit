name: collect-wikispike

on:
  schedule:
    - cron: "*/5 * * * *"   # jadwal GitHub bisa tertunda/terlewat; collector menutup celah otomatis
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: wikispike-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas requests
      - run: python collector.py
        env:
          WIKISPIKE_WIKIS: "enwiki,idwiki,jawiki"
      - name: Commit data
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "Tidak ada perubahan."; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
